plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.beguileai.app"          // MUST match Play package exactly
    compileSdk 36
    ndkVersion "28.0.13004108"             // Required for 16 KB page size support

    defaultConfig {
        applicationId "com.beguileai.app"  // MUST match Play package exactly
        minSdk 24                          // Required by Play Billing v6+
        targetSdk 36
        versionCode 32                     // 🔼 Bumped — nuclear permission strip
        versionName "3.1.1"                // 🔼 Visible app version
        // Required for Play Billing Library v6+
        resValue "string", "play_billing_provider_authority", "com.android.vending"
    }

    signingConfigs {
        release {
            storeFile file("upload-keystore.jks")
            storePassword System.getenv("STORE_PASSWORD") ?: "pass123"
            keyAlias System.getenv("KEY_ALIAS") ?: "upload"
            keyPassword System.getenv("KEY_PASSWORD") ?: "pass123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // ── NUCLEAR permission removal ──────────────────────────────────
    // tools:node="remove" in the manifest doesn't always work because
    // some library AARs re-inject permissions after the merge step.
    // This hooks into the build AFTER manifest merging and physically
    // strips the unwanted <uses-permission> lines from the final XML.
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def processManifest = output.processManifestProvider.get()
            processManifest.doLast {
                def manifestDir = processManifest.multiApkManifestOutputDirectory.get().asFile
                fileTree(manifestDir).matching { include "**/AndroidManifest.xml" }.each { File manifestFile ->
                    def text = manifestFile.text
                    def original = text
                    // Kill every permission Google Play has flagged
                    [
                        'android.permission.READ_MEDIA_IMAGES',
                        'android.permission.READ_MEDIA_VIDEO',
                        'android.permission.READ_MEDIA_AUDIO',
                        'android.permission.READ_MEDIA_VISUAL_USER_SELECTED',
                        'android.permission.READ_EXTERNAL_STORAGE',
                        'android.permission.WRITE_EXTERNAL_STORAGE',
                        'android.permission.ACCESS_MEDIA_LOCATION',
                        'android.permission.MANAGE_EXTERNAL_STORAGE',
                        'android.permission.CAMERA',
                        'android.permission.RECORD_AUDIO',
                        'android.permission.FOREGROUND_SERVICE',
                        'com.google.android.gms.permission.AD_ID',
                    ].each { perm ->
                        text = text.replaceAll(
                            /(?m)^\s*<uses-permission[^>]*android:name\s*=\s*"${java.util.regex.Pattern.quote(perm)}"[^>]*\/>\s*\n?/, ''
                        )
                    }
                    if (text != original) {
                        manifestFile.text = text
                        println "🔥 Stripped unwanted permissions from ${manifestFile}"
                    }
                }
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    // Google Play Billing dependency is pulled transitively by Flutter plugin,
    // but keep explicit to lock major version compatibility if needed.
    implementation 'com.android.billingclient:billing-ktx:6.2.1'
}
